name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Regression tests (Windows PowerShell 5.1)
        shell: powershell
        run: ./build/test.ps1
      - name: Lint (overload check, ruff)
        if: ${{ always() }}
        shell: powershell
        run: |
          python -m pip install --disable-pip-version-check --quiet ruff==0.6.9
          ./build/lint.ps1 -Only math,ruff
      - name: PSScriptAnalyzer (report only)
        if: ${{ always() }}
        shell: powershell
        continue-on-error: true
        run: |
          if (-not (Get-Module -ListAvailable -Name PSScriptAnalyzer)) { Install-Module PSScriptAnalyzer -Scope CurrentUser -Force }
          ./build/lint.ps1 -Only pssa
